<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07121c">
<title>Vehicle Health Card</title>
<style>
:root{color-scheme:dark;--bg:#07121c;--panel:#101d29;--line:#263747;--orange:#ff5a00;--white:#f7fafc;--muted:#a8b7c6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#173040 0,#07121c 55%);font-family:Arial,Helvetica,sans-serif;color:var(--white)}
main{width:min(430px,100%)}.brand{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--muted);text-align:center;margin-bottom:12px}.heading{text-align:center;font-size:27px;line-height:1.1;font-weight:900;margin:0 0 8px}.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 28px}.choices{display:grid;gap:14px}.choice{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:112px;padding:22px 20px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#142432,#0d1822);color:var(--white);text-decoration:none;box-shadow:0 10px 24px #0004;transition:transform .15s,border-color .15s}.choice:active{transform:scale(.985)}.choice:hover{border-color:var(--orange)}.label{font-size:24px;font-weight:900;letter-spacing:1px}.caption{font-size:11px;color:var(--muted);margin-top:6px}.arrow{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--orange);font-size:25px;font-weight:800;flex:none}.footer{text-align:center;color:#8294a5;font-size:10px;margin-top:25px}
</style>
</head>
<body>
<main>
  <div class="brand">VEHICLE HEALTH CARD</div>
  <h1 class="heading">Select Vehicle</h1>
  <p class="sub">Choose a health card to continue</p>
  <nav class="choices" aria-label="Vehicle options">
    <a class="choice" href="ktm.html"><div><div class="label">KTM</div><div class="caption">Vehicle Health Card</div></div><span class="arrow" aria-hidden="true">›</span></a>
    <a class="choice" href="triumph.html"><div><div class="label">TRIUMPH</div><div class="caption">Vehicle Health Card</div></div><span class="arrow" aria-hidden="true">›</span></a>
  </nav>
  <div class="footer">Select KTM or TRIUMPH to open the inspection system</div>
</main>
</body>
</html>
